{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Screen</title>
    <link rel="stylesheet" href='{% static "css/styles.css" %}'>
    <link rel="stylesheet" href='{% static "css/purchase.css" %}'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
    <main>
        {% include "sidebar.html" %}
        <div class="mainSec">
            <div class="container">
                <div class="header">
                    <h1>Purchase Invoice</h1>
                    <p><strong>Date:</strong> <input type="date" id="dateInput"></p>
                </div>

                <form>
                    <div class="form-group">
                        <label for="party">Party Name:</label>
                        <input type="text" id="party" placeholder="Enter Party Name" value="M.M DISTRIBUTORS">
                    </div>
                    <div class="form-group">
                        <label for="invoice">Invoice No:</label>
                        <input type="text" id="invoice" placeholder="Enter Invoice Number" value="4857">
                    </div>
                </form>

                <table>
                    <thead>
                        <tr>
                            <th>SN</th>
                            <th>Company</th>
                            <th>Item Name</th>
                            <th>Batch</th>
                            <th>Exp. Date</th>
                            <th>MRP</th>
                            <th>Rate</th>
                            <th>Qty</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="itemTable">
                        <!-- Rows will be dynamically added here -->
                    </tbody>
                </table>

                <div class="footer">
                    <button type="button" onclick="addRow()">Add Item</button>
                    <button type="button">Save Invoice</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        let rowCount = 1;

        function addRow() {
            const table = document.getElementById('itemTable');
            const row = document.createElement('tr');

            row.innerHTML = `
                <td>${rowCount}</td>
                <td><input type="text" placeholder="Company"></td>
                <td><input type="text" placeholder="Item Name"></td>
                <td><input type="text" placeholder="Batch"></td>
                <td><input type="date"></td>
                <td><input type="number" placeholder="MRP"></td>
                <td><input type="number" placeholder="Rate"></td>
                <td><input type="number" placeholder="Qty" onchange="calculateTotal(this)"></td>
                <td><input type="number" placeholder="Total" readonly></td>
            `;

            table.appendChild(row);
            rowCount++;
        }

        function calculateTotal(input) {
            const row = input.parentElement.parentElement;
            const rate = row.querySelector('td:nth-child(7) input').value;
            const qty = input.value;
            const totalCell = row.querySelector('td:nth-child(9) input');

            totalCell.value = (rate * qty).toFixed(2);
        }

        window.onload = function () {
            const dateInput = document.getElementById('dateInput');
            const today = new Date().toISOString().split('T')[0];
            dateInput.value = today;
        };

    </script>
</body>

</html>
