{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JD Medical</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        :root {
            --theamcolor: rgb(26 34 44);
            --theamcolorlite: rgb(36 48 63);
            --fontcolor: rgb(255 255 255);
        }

        body {
            background-color: var(--theamcolor);
            color: var(--fontcolor);
            font-family: sans-serif;
        }

        main {
            width: 100%;
            display: flex;
        }

        .sidebar {
            width: 300px;
            min-height: 100vh;
            background-color: var(--theamcolorlite);
        }

        .mainSec {
            width: calc(100% - 302px);
        }

        .mainSec>header {
            width: 100%;
            background-color: var(--theamcolorlite);
            min-height: 80px;
            /* position: fixed; */
        }

        .logosec>div {
            width: 100%;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .logosec>div>img {
            border-radius: 50%;
            max-width: 53px;
        }

        .mainSec>header {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
    </style>
</head>

<body>
    <main>
        <div class="sidebar">
            <div class="logosec">
                <div>
                    <img src='{% static "img/logo.jpeg" %}' alt="">
                    <h1>JD Medical</h1>
                </div>
            </div>
            <div class="menusec">

            </div>
        </div>
        <div class="mainSec">
            <header>
                <label for="filterInput">Show Data
                    <select name="filterInput" id="filterInput">
                        <option value="last24">Last 24 Hours</option>
                        <option value="today">Today</option>
                        <option value="yesterday">Yesterday</option>
                        <option value="thisweek">This Week</option>
                        <option value="thismonth">This month</option>
                        <option value="thisyear">This Year</option>
                        <option value="lifetime">Life Time</option>
                    </select>
                </label>

                <div>
                    <p>Choose Range</p>
                    <div>
                        <label for="fromrngdate">From
                            <input type="date" name="fromrngdate" id="fromrngdate">
                        </label>
                        <label for="torngdate">To
                            <input type="date" name="torngdate" id="torngdate">
                        </label>
                    </div>
                </div>
                <div class="headerchildren">
                    <h2>JD Medical Dashboard</h2>
                </div>
            </header>
            <div>
                jhkjkjljkljl
                kjkljkljdfs
            </div>
        </div>

    </main>
    <h1>Welcome to JD Medical</h1>


</body>

</html>
