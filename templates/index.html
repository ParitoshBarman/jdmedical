{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JD Medical</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        :root {
            --theamcolor: rgb(26 34 44);
            --theamcolorlite: rgb(36 48 63);
            --fontcolor: rgb(255 255 255);
        }

        body {
            background-color: var(--theamcolor);
            color: var(--fontcolor);
            font-family: sans-serif;
        }

        main {
            width: 100%;
            display: flex;
        }

        .sidebar {
            width: 300px;
            min-height: 100vh;
            background-color: var(--theamcolorlite);
        }

        .mainSec {
            width: calc(100% - 302px);
        }

        .mainSec>header {
            width: 100%;
            background-color: var(--theamcolorlite);
            min-height: 80px;
            /* position: fixed; */
        }

        .logosec>div {
            width: 100%;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .logosec>div>img {
            border-radius: 50%;
            max-width: 53px;
        }

        .mainSec>header {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
    </style>

    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>

    <style>
        .quicktrackingsec>.totalsalse {
            width: 350px;
            height: 250px;
        }
    </style>
</head>

<body>
    <main>
        <div class="sidebar">
            <div class="logosec">
                <div>
                    <img src='{% static "img/logo.jpeg" %}' alt="">
                    <h1>JD Medical</h1>
                </div>
            </div>
            <div class="menusec">

            </div>
        </div>
        <div class="mainSec">
            <header>
                <label for="filterInput">Show Data
                    <select name="filterInput" id="filterInput">
                        <option value="last24">Last 24 Hours</option>
                        <option value="today">Today</option>
                        <option value="yesterday">Yesterday</option>
                        <option value="thisweek">This Week</option>
                        <option value="thismonth">This month</option>
                        <option value="thisyear">This Year</option>
                        <option value="lifetime">Life Time</option>
                    </select>
                </label>

                <div>
                    <p>Choose Range</p>
                    <div>
                        <label for="fromrngdate">From
                            <input type="date" name="fromrngdate" id="fromrngdate">
                        </label>
                        <label for="torngdate">To
                            <input type="date" name="torngdate" id="torngdate">
                        </label>
                    </div>
                </div>
                <div class="headerchildren">
                    <h2>JD Medical Dashboard</h2>
                </div>
            </header>
            <div class="chartSec">
                <div class="quicktrackingsec">
                    <div class="totalsalse" id="totalsalse"></div>
                    <p style="position: relative;left: 0;top: 0;">2356</p>
                </div>
            </div>
        </div>

    </main>
    <h1>Welcome to JD Medical</h1>



    <script>
        google.charts.load('current', { packages: ['corechart', 'line'] });
        google.charts.setOnLoadCallback(drawBasic);

        function drawBasic() {
            var data = new google.visualization.DataTable();
            data.addColumn('number', 'X');
            data.addColumn('number', 'Sales');

            data.addRows([
                [0, 0], [1, 10], [2, 23], [3, 17], [4, 18], [5, 9],
                [6, 11], [7, 27], [8, 33], [9, 40], [10, 32], [11, 35],
                [12, 30], [13, 40], [14, 42], [15, 47], [16, 44], [17, 48],
                [18, 52], [19, 54], [20, 42], [21, 55], [22, 56], [23, 57],
                [24, 60], [25, 50], [26, 52], [27, 51], [28, 49], [29, 53],
                [30, 55], [31, 60], [32, 61], [33, 59], [34, 62], [35, 65],
                [36, 62], [37, 58], [38, 55], [39, 61], [40, 64], [41, 65],
                [42, 63], [43, 66], [44, 67], [45, 69], [46, 69], [47, 70],
                [48, 72], [49, 68], [50, 66], [51, 65], [52, 67], [53, 70],
                [54, 71], [55, 72], [56, 73], [57, 75], [58, 70], [59, 68],
                [60, 64], [61, 60], [62, 65], [63, 67], [64, 68], [65, 69],
                [66, 70], [67, 72], [68, 75], [69, 80]
            ]);

            var options = {
                backgroundColor: 'rgb(26, 34, 44)', // Matches --theamcolor
                chartArea: {
                    backgroundColor: 'rgb(36, 48, 63)' // Matches --theamcolorlite
                },
                hAxis: {

                    textStyle: {
                        color: 'rgb(255, 255, 255)' // Matches --fontcolor
                    },
                    titleTextStyle: {
                        color: 'rgb(255, 255, 255)' // Matches --fontcolor
                    },
                    gridlines: {
                        color: 'transparent', // Removes vertical gridlines
                    },
                    textPosition: 'none'
                },
                vAxis: {

                    textStyle: {
                        color: 'rgb(255, 255, 255)' // Matches --fontcolor
                    },
                    titleTextStyle: {
                        color: 'rgb(255, 255, 255)' // Matches --fontcolor
                    },
                    gridlines: {
                        color: 'transparent', // Removes vertical gridlines
                    },
                    textPosition: 'none'
                },
                legend: {
                    textStyle: {
                        color: 'rgb(255, 255, 255)' // Matches --fontcolor
                    }
                },
                series: {
                    0: { color: '#4caf50' } // Line color (customized to a contrasting theme color)
                }
            };

            var chart = new google.visualization.LineChart(document.getElementById('totalsalse'));
            chart.draw(data, options);
        }
    </script>

</body>

</html>
