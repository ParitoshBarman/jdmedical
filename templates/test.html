<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Most Used Medicines Chart</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
</head>

<body style="margin: 0; padding: 0; background-color: rgb(36, 48, 63); color: white; font-family: Arial, sans-serif;">
    <div id="chart_div" style="width: 100%; height: 500px;"></div>

    <script type="text/javascript">
        google.charts.load('current', { packages: ['corechart', 'bar'] });
        google.charts.setOnLoadCallback(drawMedicineChart);

        function drawMedicineChart() {
            var data = google.visualization.arrayToDataTable([
                // Headers
                ['Medicine', 'Usage Count'],
                // Example data
                ['Paracetamol', 1200],
                ['Ibuprofen', 950],
                ['Amoxicillin', 870],
                ['Metformin', 780],
                ['Atorvastatin', 680],
                ['Omeprazole', 600],
                ['Aspirin', 540],
                ['Losartan', 500],
                ['Azithromycin', 450],
                ['Levothyroxine', 400]
            ]);

            var options = {
                title: 'Most Used Medicines',
                backgroundColor: 'rgb(36, 48, 63)',
                titleTextStyle: { color: 'white', fontSize: 18 },
                chartArea: { width: '70%' },
                hAxis: {
                    title: 'Usage Count',
                    minValue: 0,
                    titleTextStyle: { color: 'white' },
                    textStyle: { color: 'white' },
                    gridlines: { color: 'transparent' }
                },
                vAxis: {
                    title: 'Medicine',
                    titleTextStyle: { color: 'white' },
                    textStyle: { color: 'white' }
                },
                legend: { position: 'none' },
                colors: ['#4caf50'] // Green for medicines
            };

            var chart = new google.visualization.BarChart(document.getElementById('chart_div'));
            chart.draw(data, options);
        }
    </script>
</body>

</html>
